# DevSecOps del frontend Nexus (Next.js) — OWASP Top 10:2025
#
#   A04      secrets          Gitleaks sobre historial y árbol de trabajo
#   A03/A05  quality          lockfile congelado, pnpm audit --prod, ESLint, tsc, vitest, build,
#                             comprobación de que ningún secreto del servidor llega al bundle
#   A05      sast             Semgrep (TypeScript, React, Next.js, OWASP Top 10)
#   A02      dockerfile       Hadolint
#   A03/A08  build            imagen única → Trivy (HIGH/CRITICAL) → SBOM CycloneDX
#                             solo push a main: ECR (tag = SHA), Cosign keyless, provenance SLSA
#
# Learner Lab: no hay OIDC IAM ni roles; la publicación usa credenciales temporales en secrets
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN). `id-token: write` se usa SOLO para
# Sigstore (Cosign keyless y attestations), nunca para AWS.
# Despliegue: este pipeline NO toca el ASG ni Terraform; el resumen del job indica los pasos manuales.
name: devsecops-frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  UV_VERSION: "0.13.9"
  SEMGREP_VERSION: "1.186.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  HADOLINT_IMAGE: "hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------------------------- A04
  secrets:
    name: "A04 · Secret scanning (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo: un secreto borrado sigue filtrado
          persist-credentials: false

      - name: Instalar Gitleaks (checksum verificado)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks sobre el historial de Git
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: Gitleaks sobre el árbol de trabajo
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  # ------------------------------------------------------------------------------------------ A03/A05
  quality:
    name: "A03/A05 · Dependencias, lint, tipos, tests y build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (versión desde packageManager)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado, sin scripts de ciclo de vida)
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (producción, falla en altas o críticas)
        run: pnpm audit --prod --audit-level high

      - name: ESLint
        run: pnpm lint

      - name: TypeScript (tsc --noEmit)
        run: pnpm typecheck

      - name: Tests unitarios y de componentes (vitest)
        run: pnpm vitest run

      - name: Build de producción con secretos canario
        run: |
          set -euo pipefail
          API_GATEWAY_KEY="canary-gw-$(openssl rand -hex 16)"
          export API_GATEWAY_KEY
          pnpm build
          pnpm check:bundle-secrets

  # ---------------------------------------------------------------------------------------------- A05
  sast:
    name: "A05 · SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Semgrep (TypeScript, React, Next.js, OWASP Top 10)
        run: |
          uvx --from "semgrep==${SEMGREP_VERSION}" semgrep scan \
            --config p/typescript --config p/react --config p/nextjs --config p/owasp-top-ten \
            --exclude '**/__tests__/**' --exclude 'src/test/**' --exclude 'openspec/**' \
            --metrics=off --error \
            src scripts docker

  # ---------------------------------------------------------------------------------------------- A02
  dockerfile:
    name: "A02 · Dockerfile (Hadolint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" "$HADOLINT_IMAGE" \
            hadolint --config /.config/hadolint.yaml - < Dockerfile

  # ------------------------------------------------------------------------------------------ A03/A08
  build:
    name: "A03/A08 · Imagen, Trivy, SBOM, publicación y firma"
    needs: [secrets, quality, sast, dockerfile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore (Cosign keyless + attestations). NO se usa para AWS (el lab no tiene OIDC IAM).
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      LOCAL_IMAGE: nexus-frontend:${{ github.sha }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      REPOSITORY: ${{ vars.ECR_REPOSITORY_FRONTEND }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Se construye UNA vez y se carga en Docker: la imagen escaneada es exactamente la que se sube.
      - name: Build multi-stage (distroless, UID 10001)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false # la provenance la emite actions/attest-build-provenance
          sbom: false
          tags: ${{ env.LOCAL_IMAGE }}
          # Públicas (no secretos): Next las incrusta en el build.
          build-args: |
            NEXT_PUBLIC_AWS_REGION=${{ vars.NEXT_PUBLIC_AWS_REGION }}
            NEXT_PUBLIC_IMAGE_HOSTS=${{ vars.NEXT_PUBLIC_IMAGE_HOSTS }}
            NEXT_PUBLIC_FARO_URL=${{ vars.NEXT_PUBLIC_FARO_URL }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Humo en modo solo lectura (read-only + tmpfs /tmp, sin capacidades)
        run: |
          set -euo pipefail
          docker run -d --name fe-smoke --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges -p 3000:3000 "$LOCAL_IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          test "$(docker inspect --format '{{.Config.User}}' "$LOCAL_IMAGE")" = "10001:10001"
          docker rm -f fe-smoke

      - name: Trivy (vulnerabilidades, secretos y misconfig en la imagen; falla en HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          timeout: 20m

      - name: SBOM CycloneDX de la imagen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: cyclonedx
          output: sbom-frontend.cdx.json
          skip-setup-trivy: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-frontend
          path: sbom-frontend.cdx.json
          retention-days: 90

      # ---------------- Solo en push a main: publicar, firmar y attestar ----------------
      - name: Credenciales AWS (sesión temporal del Learner Lab)
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Login en Amazon ECR
        if: env.PUBLISH == 'true'
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Push a ECR con tag inmutable (SHA del commit)
        if: env.PUBLISH == 'true'
        id: push
        run: |
          set -euo pipefail
          target="${REGISTRY}/${REPOSITORY}:${GITHUB_SHA}"
          docker tag "$LOCAL_IMAGE" "$target"
          docker push "$target"
          ref=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$target" | grep "^${REGISTRY}/${REPOSITORY}@" | head -1)
          [ -n "$ref" ] || { echo "::error::No se obtuvo el digest de ${target}"; exit 1; }
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLISH == 'true'

      - name: Cosign keyless (firma + SBOM attestado, por digest)
        if: env.PUBLISH == 'true'
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type cyclonedx --predicate sbom-frontend.cdx.json "$IMAGE_REF"

      - name: Provenance SLSA (GitHub attestation)
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Siguiente paso (manual)
        if: env.PUBLISH == 'true'
        env:
          IMAGE_REF: ${{ steps.push.outputs.ref }}
        run: |
          {
            echo "### Imagen publicada y firmada"
            echo ""
            echo "- Tag: \`${GITHUB_SHA}\`"
            echo "- Referencia por digest: \`${IMAGE_REF}\`"
            echo ""
            echo "### Despliegue (manual, en nexus-infrastructure)"
            echo ""
            echo "1. \`frontend_image_tag = \"${GITHUB_SHA}\"\` en \`terraform.tfvars\`"
            echo "2. \`terraform apply\` (actualiza el launch template)"
            echo "3. Instance refresh del ASG del frontend (\`make frontend-roll\`)"
            echo "4. Verificar: \`cosign verify\` del digest antes del refresh"
          } >> "$GITHUB_STEP_SUMMARY"
